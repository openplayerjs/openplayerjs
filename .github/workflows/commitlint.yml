on:
  pull_request:
    branches: ['**']

name: Commitlint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  commitlint:
    name: Enforce Conventional Commits
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Lint only commits that are genuinely unique to this PR branch by
          # using the true merge-base of the base branch and PR head.
          # This avoids flagging commits that were squash-merged into master
          # and are only reachable via merge commits in the branch graph.
          from=$(git merge-base "$PR_BASE" "$PR_HEAD")
          pnpm exec commitlint --from "$from" --to "$PR_HEAD"
